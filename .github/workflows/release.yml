name: Prepare Release
run-name: Release ${{ inputs.release_type }} triggered by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

jobs:
  prepare-release:
    name: Open release PR against master
    # Reusable workflow: secure-software-engineering/actions/release/README.md
    uses: secure-software-engineering/actions/.github/workflows/maven-release-prepare.yml@6856b8183bba81fce20d9052b9aa6f3e20823b36 # develop
    with:
      release_type: ${{ inputs.release_type }}
      head_branch: master
      java_version: '21'
      tag_pattern: 'V{major}.{minor}.{patch}'
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }} # default GITHUB_TOKEN is blocked by branch protection / can't trigger downstream workflows
