name: Release Schedule

on:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read

jobs:
  schedule:
    permissions:
      contents: read
      pull-requests: read
    uses: secure-software-engineering/actions/.github/workflows/maven-release-schedule.yml@7a286175a5ce134571e0228fc4da41885f2821e3 # develop
    with:
      head_branch: master
      java_version: '21'
      tag_pattern: 'V{major}.{minor}.{patch}'
      release_ready_age_days: '28'
      stale_pr_age_days: '7'
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }}
